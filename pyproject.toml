[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevlet"
version = "0.1.0"
description = "A small, calibrated System One decision layer (Jev-style noul / choice / score) for offline edge agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Krish Viswanathan" }]
dependencies = ["numpy>=1.24", "pyyaml>=6", "requests>=2.31"]

[project.optional-dependencies]
encoders = ["torch>=2.2", "transformers>=4.44", "safetensors", "sentencepiece", "onnxruntime>=1.17"]
bench = ["scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["jevlet*"]
